[project]
name = "financial-compliance-review"
version = "0.1.0"
description = "金融产品合规智能审查系统"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "fpdf2>=2.7",  # 测试样张生成
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI 依赖注入 Depends() 出现在参数默认值中属惯用法

[tool.ruff.lint.per-file-ignores]
# 独立脚本（scripts/ 下可直接 python xxx.py 运行）先 sys.path.insert 定位仓库根，
# 再导入 src 包——E402 属刻意模式，本地与容器内均可直接执行。
"scripts/*.py" = ["E402"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
