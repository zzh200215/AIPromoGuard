# staging 环境：与演示栈同机隔离部署（端口错开 / 容器名 staging- 前缀 / 独立数据卷 + 独立数据目录）。
#
# 用途：PR 合入 main 后先在此冒烟（健康+登录+任务列表+前端页面四断言），
#       演示环境只在演示前定点同步——演示环境永远只跑验证过的版本。
#
# 使用：
#   python scripts/deploy/init_staging.py     # 幂等初始化：镜像检查 + chroma 快照 + 起栈 + 种子
#   python scripts/demo/smoke_staging.py      # 冒烟四断言（失败退出码 1）
#
# 镜像：本 compose 不做 build（规避中文路径 buildx bug docker/buildx#3972），
#       复用预先构建的镜像（构建方法见 docker-compose.yml 顶部注释；前端镜像见 Dockerfile.frontend）：
#         financial-compliance-review-api  -> staging-api
#         financial-compliance-review-web  -> staging-web
name: fcr-staging

services:
  staging-mysql:
    image: mysql:8.0
    container_name: staging-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: compliance_review
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 主栈 3307 / 本机原生 3306，staging 错开到 3308
      - "3308:3306"
    volumes:
      - staging_mysql_data:/var/lib/mysql
      # 不挂 init SQL：schema 由 staging-api 启动时 `alembic upgrade head` 管理（PR-0a）
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m   # 同机双栈，控制内存占用（staging 数据量级足够）

  staging-redis:
    image: redis:7-alpine
    container_name: staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    # 不映射宿主机端口：仅容器内互联（/api/v1/health 的 redis 探活依赖它）

  staging-api:
    image: financial-compliance-review-api
    container_name: staging-api
    restart: unless-stopped
    # 迁移前置：与主栈同口径（新库建表 / 已有库幂等升级）
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn src.api.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      staging-mysql:
        condition: service_healthy
      staging-redis:
        condition: service_healthy
    env_file: ../.env
    environment:
      MYSQL_HOST: staging-mysql
      MYSQL_PORT: 3306            # 容器内直连，非宿主 3308
      REDIS_URL: redis://staging-redis:6379/0
      EMBEDDING_CACHE_DIR: /app/.modelcache
      # 独立数据目录（uploads/reports/chroma）——staging 冒烟不弄脏演示数据；
      # chroma 由 init_staging.py 从主数据目录快照复制
    ports:
      - "8001:8000"               # 主栈 8000，staging 错开到 8001
    volumes:
      - ../configs:/app/configs:ro
      - ../data_staging:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  staging-web:
    image: financial-compliance-review-web
    container_name: staging-web
    restart: unless-stopped
    depends_on:
      staging-api:
        condition: service_healthy
    environment:
      API_UPSTREAM: staging-api:8000   # nginx 模板 envsubst 注入
    ports:
      - "8081:80"                 # 本机 5173 开发 / 8000 主 API，staging 前端错开到 8081

volumes:
  staging_mysql_data:
  staging_redis_data:
