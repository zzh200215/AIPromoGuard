# LLM 引擎语义回归门禁：held-out 变体集（保义改写绕开全部字面规则）跑全链路，
# 召回/误报跌破阈值即红。补齐「规则引擎有 CI 门禁、LLM 引擎没有」的缺口。
#
# 与 eval-gate.yml 的分工：
#   eval-gate = 规则引擎指标门禁（确定性、零 LLM key、每次 push 必跑）
#   llm-eval  = LLM 语义引擎回归（需真实调用、有成本，手动/周度跑，不随 push 触发）
#
# 启用方式（一次性，两处都配）：
#   1) Settings → Secrets and variables → Actions → Secrets → 新增 DASHSCOPE_API_KEY
#      （或任何 OpenAI 兼容网关 key；网关非默认时同步配 LLM_BASE_URL / LLM_MODEL
#        secret——env 里已接线，未配置时回退下方与 Settings 一致的默认值）
#   2) 同页 Variables → 新增 LLM_EVAL_ENABLED = true
#   说明：job 级 if 不支持 secrets 上下文（actionlint 校验约束），故用 vars 做显式开关；
#   未开开关时本 workflow 显示 skipped（诚实状态，不假装在跑）。
# 阈值口径：变体集全链路基线为召回 100% / 误报 0%（docs/benchmark.md），
# 门禁放宽到 0.95 / 0.05 留模型漂移余量——跌破说明 LLM 引擎行为回归，红。
name: llm-eval

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0"  # 每周一 05:00 北京时间

jobs:
  llm-eval:
    if: vars.LLM_EVAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: compliance_review
          TZ: Asia/Shanghai
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot123 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      MYSQL_DATABASE: compliance_review
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      # 网关非默认时用 secret 覆盖；secret 未设置时 GitHub 注入空串，|| 回退默认值
      # （Settings.llm_base_url/llm_model 对空串不设防，此处必须兜底）
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://token.sensenova.cn/v1' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-v4-flash' }}
      # 免费网关限流墙（rpm exhausted，实测有效 RPM≈5）：默认 2 次重试扛不住
      # 71 例全链路的持续 429，需与本地一致的 5 级梯子（3s→6s→…→48s）
      LLM_RATE_LIMIT_RETRIES: "5"
      # 工具循环（ReAct 法规查证）单次往返可达 35~65s，默认 120s 偏紧（见 .env.example）
      LLM_TIMEOUT: "240"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Init schema (Alembic)
        run: python -m alembic upgrade head

      - name: Seed rules + regulations (LLM 引擎检索上下文所需)
        run: |
          python scripts/init_data/import_rules.py
          python scripts/init_data/import_regulations.py

      - name: Build article vector index
        run: python scripts/init_data/index_articles.py

      - name: Run LLM-engine eval on held-out variant set (gated)
        run: |
          set -o pipefail
          mkdir -p scripts/evaluate/reports
          python scripts/evaluate/evaluate.py --engine full \
            --cases scripts/evaluate/variant_cases.json \
            --min-recall 0.95 --max-fpr 0.05 \
            | tee scripts/evaluate/reports/llm-eval-variant.txt

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-report
          path: scripts/evaluate/reports/
          retention-days: 30
