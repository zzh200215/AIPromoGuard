# Alembic configuration -- single authority for schema evolution.
#
# NOTE: this file is intentionally ASCII-only. Alembic reads it with
# encoding="locale" (GBK on zh-CN Windows), so non-ASCII comments would
# crash config parsing. Chinese docs live in migrations/README.md.
#
# The database URL is NOT maintained here: src/utils/config.settings
# (.env driven) is the single source of truth, see migrations/env.py.
#
# Common commands (run from repo root):
#   python -m alembic upgrade head                       # upgrade (new db = full schema)
#   python -m alembic revision --autogenerate -m "desc"  # generate migration from ORM models
#   python -m alembic stamp head                         # mark existing db as current
#   python -m alembic downgrade -1                       # rollback one step
#   python -m alembic -x dbname=xxx upgrade head         # override target db (drift check)
#   python -m alembic upgrade head --sql                 # offline mode: print SQL only

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# left empty: env.py injects settings.mysql_url (avoids configparser interpolation issues)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
