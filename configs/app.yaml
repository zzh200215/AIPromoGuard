app:
  name: financial-compliance-review
  version: 0.1.0
  env: dev
  debug: true

# LLM（QWEN）配置：真实 Key 放 .env，这里只放非敏感默认
llm:
  provider: sensenova      # 实际生效的 Key/Base/模型见 .env（LLM_BASE_URL/LLM_MODEL）
  model: deepseek-v4-flash # 与 .env 保持一致，仅作文档口径
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 120
  fallback_models: [glm-5.2]  # 主模型失败时的降级模型（须在同一网关可用）
  # 真 function calling：LLM 审查时主动调法规检索工具查证再判定（ReAct 式自我查证）
  tool_calling:
    enabled: true            # 总开关；false 时 achat_json 走原纯 json_object 路径
    tool_choice: auto        # auto | none | required 或 {"function": {...}}
    max_tool_rounds: 2       # 最大工具循环回合数（成本护栏）
    max_tool_calls_total: 4  # 单块审查累计工具调用上限（成本护栏）

# 向量检索
vectorstore:
  type: chroma               # 唯一实现（Milvus 死分支已按 PR-8 清理，见 README 已知限制）
  top_k: 10
  distance: cosine
  collection_prefix: legal_
  # 混合检索重排（可选）：RRF 融合后用 cross-encoder 精排。
  # 默认关闭——bge-reranker 模型体积大（首次启用需下载），开启前确认磁盘/内存。
  rerank:
    enabled: false
    model: BAAI/bge-reranker-base
    weight: 0.7              # rerank 分权重（余下 1-w 为 RRF 分）

# 文档解析
parser:
  chunk_size: 500            # 字符数
  chunk_overlap: 50
  chunk_respect_headings: true   # 方向④语义切块：按标题边界优先断开，减"一条违规被切缝劈两半"
  max_file_size_mb: 50
  allowed_exts: [pdf, doc, docx, txt, png, jpg, jpeg, bmp]
  mask_sensitive: true       # 解析阶段脱敏（身份证/手机号/银行卡/金额）
  mineru_enabled: false      # R2-1 MinerU 深解析通道（扫描件全文+表格补充）；需 pip install mineru，CPU ~0.2 页/s
  mineru_always: false       # true = 文字版 PDF 也走混合解析补表格块（成本高，默认关）
  mineru_tier: standard      # MinerU 解析档位（spike：advanced 对漏块无改善，用 standard）
  pdf_tables_enabled: true   # PR-5 文字版 PDF 表格通道：pdfplumber 抽表 → markdown 表格块
                             # （只补不替，供勾稽消费；spike 10/10，data/spike_pdfplumber/report.json）

# 规则引擎
rule_engine:
  scan_timeout_seconds: 30
  min_confidence: 0.5        # W18：命中置信度下限，低于则过滤（精调杠杆，降误报）
  # 半自动规则精调（方向③）：对高误报规则生成建议动作，阈值驱动
  tuning:
    min_samples: 3           # 人工复核样本数下限，不足不生成建议
    fp_threshold: 0.5        # 误报率下限，低于不出建议
    keyword_fp_min: 2        # 某关键词至少误报命中 N 次才建议移除

# 领域（W19：配置驱动，新增领域只需加配置+导入数据，不改逻辑代码）
# 示例扩展（可行性验证，未导入数据时先保持注释）：
#   trust:
#     label: 信托
#     keywords: [信托, 受托人, 委托人, 信托计划, 信托财产, 信托贷款]
domains:
  banking:
    label: 银行理财
    keywords: [理财, 银行, 存款, 年化, 资管, 预期收益, 收益率, 理财产品, 净值型]
  fund:
    label: 基金销售
    keywords: [基金, 申购, 赎回, 净值, 基金经理, 份额, 基金合同, 招募说明书, 托管人]
  insurance:
    label: 保险产品
    keywords: [保险, 保额, 保费, 理赔, 保单, 寿险, 重疾, 投保, 保险责任, 被保险人]

# 审查工作流（LangGraph，W3 启用）
workflow:
  regulation_top_k: 5        # 每个 chunk 召回法规条款数
  synonym_expansion: true    # 检索第四路：营销话术→监管术语同义扩展（确定性零 LLM）。
                             # 2026-10-24 judge 诊断：30 例检索相关性 0.413，"稳赚/翻倍"类
                             # 口语与"承诺收益"类书面语无词面重叠、语义桥接不足，正主条款
                             # 进不了 Top-K；映射表见 regulation_service.MARKETING_SYNONYMS
  regulation_dedup_per_doc: 1   # 同一部法规最多保留几条召回（0=关闭，保持历史行为）。
                                # 设为 1：多部法规各出一条，避免 Top-K 被同一部法规的近似条款占满
                                # （2026-10-22 实测：理财直播材料 Top5 有 3 条来自同一部办法，
                                #  对口的《金融产品网络营销管理办法》排第 6 被挤出；设为 1 后进第 4 位）
  llm_concurrency: 1         # LLM 并发审查块数（asyncio.Semaphore 限流）；2026-10-12 首次实战实测 8 并发打爆网关 RPM（rpm exhausted），降为串行
  llm_scan_chunk_chars: 0     # 小段合并成"扫描单元"的字符上限：一个单元一次 LLM 调用（0=关闭，一段一调用）。
                              # 2026-10-22 实测：583 字话术切 6 段 → 6 次串行调用共 277s；合并成 1 单元后 78s（3.6×），
                              # **但检出的独立违规点从 6 个降到 4 个**（"内部测算""风险提示小字"丢失）。
                              # 合规场景不能用召回换速度，故默认关闭；需要批量跑成本优先的场景可临时开启。
  llm_max_chunks: 0          # LLM 审查块数上限：0 = 审查全部块（默认，长文档不漏审）；>0 为显式成本护栏
  llm_confidence_threshold: 0.5   # LLM 输出置信度下限，低于则丢弃（幻觉抑制）
  # 判定先例记忆（第 2 批）：人工复核终态结论沉淀为可召回先例，审查时注入 LLM 上下文。
  # 零 LLM 成本（本地 embedding 召回）；关闭后 llm_scan prompt 与无记忆版逐字节一致
  precedent_memory: true
  precedent_top_k: 3             # 每个扫描单元注入的先例数上限
  # Verifier 独立复核（第 3 批生成-验证对偶）：对 LLM 单独命中做机器侧批量验证（每任务 +1 次调用）。
  # rejected 且验证置信度达标才剔除（宁少杀不错杀）；降级只压 confidence 保留人工可见。
  # 缺省关（与 agentic_retrieval 同先例：LLM 成本类增强显式开启）
  verifier: false
  verifier_max_findings: 20      # 单次批量验证的判定条数上限（成本护栏）
  verifier_reject_min_confidence: 0.75  # 剔除所需的最低验证置信度
  # 执行强度分级（第 4 批）：light=零风险信号短文本只走规则引擎；deep=多工具深查（显式开启）
  scan_intensity: true
  light_max_chars: 120         # 轻量通道的文档总字数上限（且须零风险信号词）
  deep_scan: false             # 深查通道总开关（长文档多工具 ReAct，配额敏感显式开启）
  deep_min_chars: 3000         # 深查触发阈值：文档总字数
  deep_min_blocks: 40          # 深查触发阈值：段落数（满足其一即可）
  deep_tool_rounds: 6          # 深查工具循环回合上限（覆盖 llm.tool_calling 默认 2）
  deep_tool_calls: 8           # 深查工具累计调用上限（覆盖默认 4）
  # 人审分流（方向②）：规则引擎/双引擎高置信命中自动确认，纯 LLM 一律进人工队列。
  # confirmed_by=0 标识系统自动确认；反馈统计只计人工复核（confirmed_by>0），保证精调数据干净。
  auto_confirm:
    enabled: true
    threshold: 0.85
  # 人工复核关卡（LangGraph interrupt + checkpointer，PRD §3.2 人工干预节点）：
  # 开启后 severity 命中 review_severities 或 source 命中 review_sources 的结论
  # 在报告生成前暂停等人，POST /tasks/{id}/human-review 提交决策后续跑。
  # 默认关闭——既有审查路径行为不变；InMemorySaver 限同进程（见 runtime.py 部署说明）。
  human_review:
    enabled: false
    review_severities: [high]
    review_sources: [hybrid]

# 监管动态追踪（Regulatory Radar）：轮询监管机构发布源，发现新法规进待确认列表
# enabled=false 的源需人工录入兜底（SPA/CDN 接口待探测确认后启用）
regulation_monitor:
  enabled: true
  request_timeout: 20
  max_items_per_source: 50        # 每源每次最多入库条目数
  llm_batch_size: 20              # 批量打标一次最多标题数
  sources:
    - name: pbc
      label: 中国人民银行
      enabled: true
      list_url: http://www.pbc.gov.cn/tiaofasi/144941/144957/index.html
    - name: nfra
      label: 国家金融监督管理总局
      enabled: true
      list_url: https://www.nfra.gov.cn/cbircweb/DocInfo/SelectDocByItemUUIdsAndChild?itemUUids=910303&pageIndex=1&pageSize=50
    - name: csrc
      label: 中国证监会
      enabled: true
      list_url: http://www.csrc.gov.cn/csrc/c106256/fg.shtml
